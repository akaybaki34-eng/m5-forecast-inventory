[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-inventory"
version = "2.0.0"
description = "Does a more accurate demand forecast make a cheaper inventory? A leakage-safe forecast-to-inventory decision framework on the M5 Walmart dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
